dataset: mmact
modality: skeleton
model:
  name: ctrgcn_head
  arch: ctrgcn_head
  num_joints: 17
  num_classes: 35
  dropout: 0.4
  part_drop: 0.1
  drop_path: 0.1
  tf_depth: 2
  tf_heads: 4
  stream: rich
train:
  epochs: 80
  batch_size: 256
  num_workers: 16
  amp: true
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0005
  grad_clip: 3.0
  ema_decay: 0.999
  aug_level: light
  label_smoothing: 0.1
  scheduler: cosine_warmup
  warmup_epochs: 3
  early_stop_patience: 15
  head_lr_mult: 1.0
output_dir: outputs/checkpoints/skeleton_mmact
