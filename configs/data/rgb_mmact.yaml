dataset: mmact
modality: rgb

paths:
  manifest_dir: data/processed/MMAct/manifests/protocols
  protocol: x_view
  train_manifest: train.csv
  val_manifest: val.csv

sampling:
  num_frames: 16
  stride: 1

transform:
  resize: 224
  crop_pct: 0.875
  mean: [0.45, 0.45, 0.45]
  std:  [0.225, 0.225, 0.225]
