dataset: mmact
modality: skeleton

paths:
  manifest_dir: data/processed/MMAct/manifests/multimodal_cross_view_3way
  train_manifest: train_cross_view.csv
  val_manifest: val_cross_view.csv
  test_manifest: test_cross_view.csv
  test_available: true
  test_note: "Internal group-disjoint multimodal test split"

layout:
  num_joints: 17            # COCO
  coords: [x, y, conf]

normalize:
  root_joints: [11, 12]     # hip L + hip R → midpoint
  scale_joints: [5, 6]      # shoulder L + shoulder R → distance

sequence:
  target_len: 64            # resample về 64 frame
  interpolation: linear
