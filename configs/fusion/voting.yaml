# Fusion voting config
benchmark:
  architecture_audit: configs/fusion/architecture_audit.yaml
  # Train từng architecture từ đầu trước khi chọn best theo val macro-F1.
  # `stgcn` và `ctrgcn` là các backbone paper-family đã được điều chỉnh cho
  # COCO-17/MMAct. `ms_g3d`, `sta_gcn`, `ctrgcn_head`, `dual` là biến thể
  # custom/ablation và sẽ được ghi provenance trong results.csv.
  # Barlow Twins không nằm trong benchmark kiến trúc chính vì đây là objective
  # SSL lai CE+Barlow, cần một protocol pretrain riêng để so sánh công bằng.
  split: cross_view
  seed: 42
  # Final selected architectures for the controlled fusion experiment.
  architectures:
    skeleton: [ctrgcn_head]
    imu: [tcn]
    rgb: [mc3_18]

fusion:
  num_classes: 35
  # Modalities có thể dùng
  candidates: [skeleton, imu, rgb]

  # Models fixed after the modality benchmark.
  architectures:
    skeleton: [ctrgcn_head]
    imu: [tcn]
    rgb: [mc3_18]

  # Grid search weight step
  weight_step: 0.1

  # Metric để chọn best
  select_metric: f1_macro

  # Min samples để đưa modality vào fusion (bỏ qua quick-test runs)
  min_val_samples: 500

paths:
  manifest_dir: data/processed/MMAct/manifests/multimodal_cross_view_3way
  train_manifest: train_cross_view.csv
  val_manifest: val_cross_view.csv
  test_manifest: test_cross_view.csv

# Evaluation protocol. All learned fusion methods fit on the same aligned fit
# split and are evaluated on the same eval split. For an untouched final score,
# set eval_split to a held-out test manifest after model selection. Set
# fit_source to oof only after generating oof_train_{probs,labels,clip_ids}.npy.
evaluation:
  fit_split: train_cross_view
  fit_source: oof
  eval_split: test_cross_view

# Learned meta-fusion.  It consumes the aligned fit predictions from the
# selected modality runs and evaluates on the aligned evaluation predictions.
attention:
  epochs: 80
  batch_size: 512
  hidden_dim: 32
  num_heads: 2
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.001
  patience: 10
  seed: 42

output:
  root: outputs/runs
