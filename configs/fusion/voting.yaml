# Fusion voting config
benchmark:
  architecture_audit: configs/fusion/architecture_audit.yaml
  # Train từng architecture từ đầu trước khi chọn best theo val macro-F1.
  # `stgcn` và `ctrgcn` là các backbone paper-family đã được điều chỉnh cho
  # COCO-17/MMAct. `ms_g3d`, `sta_gcn`, `ctrgcn_head` là biến thể
  # custom/ablation và sẽ được ghi provenance trong results.csv.
  # Barlow Twins không nằm trong benchmark kiến trúc chính vì đây là objective
  # SSL lai CE+Barlow, cần một protocol pretrain riêng để so sánh công bằng.
  split: x_view
  seed: 42
  # Final selected architectures for the controlled fusion experiment.
  architectures:
    skeleton: [ctrgcn_head]
    imu: [tcn]
    rgb: [mc3_18]

fusion:
  num_classes: 35
  # Modalities có thể dùng
  candidates: [skeleton, imu, rgb]

  # Models fixed after the modality benchmark.
  architectures:
    skeleton: [ctrgcn_head]
    imu: [tcn]
    rgb: [mc3_18]

  # Grid search weight step
  weight_step: 0.1

  # Metric để chọn best
  select_metric: f1_macro

  # Min samples để đưa modality vào fusion (bỏ qua quick-test runs)
  min_val_samples: 500

paths:
  manifest_root: data/processed/MMAct/manifests/protocols
  protocol: x_view

# Learned fusion fits on OOF train predictions and reports the validation split.
# There is no internal test split in the six-protocol workflow.
evaluation:
  fit_split: train
  fit_source: oof
  eval_split: val

# Learned meta-fusion.  It consumes the aligned fit predictions from the
# selected modality runs and evaluates on the aligned evaluation predictions.
attention:
  epochs: 80
  batch_size: 512
  hidden_dim: 32
  num_heads: 2
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.001
  patience: 10
  seed: 42

output:
  root: outputs/runs
